services:
  # ==========================================
  # 1. DỊCH VỤ BACKEND
  # ==========================================
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: shop-2hand-backend
    ports:
      - "3000:3000"
    env_file:
      - ./BE/.env
    volumes:
      - ./BE:/app
      - /app/node_modules
    command: npx nodemon -L index.js
    restart: unless-stopped

  # ==========================================
  # 2. DỊCH VỤ FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: shop-2hand-frontend
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      - backend
