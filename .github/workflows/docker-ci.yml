name: Production CI/CD Pipeline Tuyen05

on:
  push:
    branches: [ "master", "main" ]

jobs:
  # ========================================================
  # GIAI ĐOẠN 1: KIỂM ĐỊNH MÃ NGUỒN (CI)
  # ========================================================
  test-code:
    name: 🧪 Run Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./BE/package-lock.json

      - name: Install Backend dependencies
        run: |
          cd BE
          npm install

      - name: Run Backend Unit Tests
        run: |
          cd BE
          npm test

  # ========================================================
  # GIAI ĐOẠN 2: ĐÓNG GÓI & PHÂN PHỐI DOCKER (CD)
  # ========================================================
  build-and-push-docker:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    # CHỈ CHẠY KHI JOB TEST Ở TRÊN ĐÃ PASS 100%!
    needs: test-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push BACKEND với Cache + Đánh số phiên bản SHA
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-2hand-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-2hand-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push FRONTEND với Cache + Đánh số phiên bản SHA
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-2hand-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-2hand-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max